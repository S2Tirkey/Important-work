<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PDF Viewer</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        .pdf-container {
            width: 100%;
            height: 100vh;
        }

        .pdf-container embed {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

    <div class="pdf-container">
        <embed 
            src="avcd.pdf"
            type="application/pdf">
    </div>

</body>

</html>
